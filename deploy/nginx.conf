# Reverse proxy TLS devant php-fpm.
# Le certificat est fourni par certbot (voir docs/exploitation.md).

server {
    listen 80;
    server_name ${NOM_DE_DOMAINE};

    # Seul le challenge Let's Encrypt reste en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${NOM_DE_DOMAINE};

    ssl_certificate     /etc/letsencrypt/live/${NOM_DE_DOMAINE}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NOM_DE_DOMAINE}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # L'API ne sert que du JSON à deux applications connues.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/html/public;
    index index.php;

    # 5 preuves de 10 Mo dans une même requête.
    client_max_body_size 60M;

    # Aucune trace d'URL dans les logs : une URL de suivi contient le code
    # du dossier, qui est le seul secret dont dispose le citoyen.
    access_log off;
    error_log /var/log/nginx/error.log error;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Le stockage des preuves n'est jamais servi en direct.
    location ~ ^/(storage|\.) {
        deny all;
    }
}
